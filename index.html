<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaizen Code — Ingeniería de software para productos que deben funcionar</title>
    <meta
      name="description"
      content="Estudio de ingeniería de software en México. Diseñamos, construimos y operamos plataformas web, APIs e integraciones con IA con estándares de producción: tipado de punta a punta, CI/CD, observabilidad y seguridad desde el día uno."
    />
    <meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Kaizen Code" />
    <meta property="og:title" content="Kaizen Code — Ingeniería de software" />
    <meta
      property="og:description"
      content="Plataformas web, APIs e integraciones con IA construidas con estándares de producción."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="/assets/kaizenlogo-removebg-preview.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the stored/system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kaizen Code",
        "description": "Estudio de ingeniería de software en México.",
        "areaServed": "MX",
        "knowsAbout": ["Software engineering", "Cloud architecture", "LLM integration", "DevOps"]
      }
    </script>
  </head>
  <body>
    <noscript>Kaizen Code requiere JavaScript para mostrar este sitio.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
